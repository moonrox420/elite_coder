<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elite Coding Assistant</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --accent: #7c3aed; --accent2: #a78bfa;
    --user-bubble: #1f6feb; --ok: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #4f46e5);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { font-size: 12px; color: var(--muted); margin: 0; }
  .status {
    margin-left: auto; font-size: 12px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .status.online { color: var(--ok); border-color: rgba(63,185,80,.4); }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .inner { max-width: 860px; margin: 0 auto; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: 12px; margin: 8px 0;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 14px;
  }
  .user { background: var(--user-bubble); margin-left: auto; }
  .bot { background: var(--panel); border: 1px solid var(--border); }
  .meta {
    font-size: 11px; color: var(--muted); margin: 2px 0 10px; text-align: right;
  }
  .hero { text-align: center; color: var(--muted); margin-top: 12vh; }
  .hero h2 { color: var(--text); margin-bottom: 6px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .chip {
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
  .inputrow { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px;
    font-family: inherit; font-size: 14px; height: 48px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send {
    background: var(--accent); border: none; color: #fff; border-radius: 10px;
    padding: 0 22px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  button.send:disabled { opacity: .5; cursor: wait; }
  .typing { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  code, pre {
    font-family: Consolas, 'Cascadia Code', monospace; font-size: 13px;
    background: #0a0d12; border-radius: 6px;
  }
  code { padding: 1px 5px; }
  pre { padding: 10px 12px; overflow-x: auto; border: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <div class="logo">&#129302;</div>
  <div>
    <h1>Elite Coding Assistant</h1>
    <p class="sub">Intent &bull; Language &bull; Hybrid RAG &bull; Memory &bull; Active Learning</p>
  </div>
  <span class="status" id="status">connecting&hellip;</span>
</header>

<main>
  <div class="inner" id="chat"></div>
  <div class="hero" id="hero">
    <h2>Ask a coding question</h2>
    <p>Queries route through the fine-tuned classifier into hybrid RAG + Ollama generation.</p>
    <div class="chips">
      <button class="chip" onclick="ask(this.textContent)">write a python script that counts in a fibonacci sequence to the 25th sequence</button>
      <button class="chip" onclick="ask(this.textContent)">explain how python decorators work</button>
      <button class="chip" onclick="ask(this.textContent)">hello</button>
    </div>
  </div>
</main>

<footer>
  <div class="inputrow">
    <textarea id="input" placeholder="Ask the assistant&hellip; (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const heroEl = document.getElementById('hero');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const statusEl = document.getElementById('status');
let sessionId = null;
let busy = false;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function render(text) {
  // Minimal markdown-ish rendering: fenced code blocks + inline code.
  let html = esc(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    '<pre><code>' + code + '</code></pre>');
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return html;
}
function addBubble(role, text) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
  b.innerHTML = role === 'user' ? esc(text) : render(text);
  chatEl.appendChild(b);
  window.scrollTo(0, document.body.scrollHeight);
  return b;
}
function addMeta(text) {
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = text;
  chatEl.appendChild(m);
}
function hideHero() { if (heroEl) heroEl.style.display = 'none'; }

async function checkHealth() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    statusEl.textContent = j.model + ' \u00b7 ' + j.device;
    statusEl.className = 'status online';
  } catch {
    statusEl.textContent = 'offline';
    statusEl.className = 'status';
  }
}

async function ask(text) {
  const msg = (text ?? inputEl.value).trim();
  if (!msg || busy) return;
  busy = true;
  sendEl.disabled = true;
  inputEl.value = '';
  hideHero();
  addBubble('user', msg);
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'thinking\u2026';
  chatEl.appendChild(typing);
  window.scrollTo(0, document.body.scrollHeight);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
    });
    const j = await r.json();
    sessionId = j.session_id;
    typing.remove();
    if (j.error) {
      addBubble('bot', '[' + j.error + ']');
    } else {
      addBubble('bot', j.reply);
      addMeta('intent: ' + j.intent + ' (' + j.intent_confidence + ')' +
              ' \u00b7 lang: ' + j.language + ' (' + j.language_confidence + ')');
    }
  } catch (e) {
    typing.remove();
    addBubble('bot', '[request failed] ' + e);
  } finally {
    busy = false;
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', () => ask());
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
checkHealth();
</script>
</body>
</html>
